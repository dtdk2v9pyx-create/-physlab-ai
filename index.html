<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PHYSLAB AI — Физика 8–9 класс</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #090d18;
    color: white;
    min-height: 100vh;
}

button {
    font-family: inherit;
    cursor: pointer;
}

.header {
    height: 70px;
    background: #101729;
    border-bottom: 1px solid #26304a;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 35px;
    position: sticky;
    top: 0;
    z-index: 10;
}

.logo {
    font-size: 24px;
    font-weight: bold;
}

.logo span {
    color: #5b8cff;
}

.header-right {
    color: #9ca8c3;
    font-size: 14px;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 35px 20px 70px;
}

.hero {
    background: linear-gradient(135deg, #121d38, #111827);
    border: 1px solid #263657;
    border-radius: 25px;
    padding: 45px;
    margin-bottom: 30px;
}

.hero h1 {
    font-size: 42px;
    margin-bottom: 15px;
}

.hero h1 span {
    color: #5b8cff;
}

.hero p {
    color: #aeb9d0;
    max-width: 700px;
    line-height: 1.6;
    font-size: 17px;
}

.section-title {
    font-size: 27px;
    margin: 35px 0 18px;
}

.grade-buttons {
    display: flex;
    gap: 12px;
    margin-bottom: 25px;
}

.grade-btn {
    background: #151e34;
    border: 1px solid #2c3959;
    color: #b9c4db;
    padding: 12px 25px;
    border-radius: 12px;
    font-size: 15px;
}

.grade-btn.active,
.grade-btn:hover {
    background: #4169e1;
    color: white;
    border-color: #4169e1;
}

.topics {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 15px;
}

.topic-card {
    background: #111827;
    border: 1px solid #26324e;
    border-radius: 18px;
    padding: 22px;
    transition: .2s;
}

.topic-card:hover {
    transform: translateY(-3px);
    border-color: #527cff;
    background: #141e32;
}

.topic-number {
    color: #5b8cff;
    font-size: 13px;
    margin-bottom: 10px;
}

.topic-card h3 {
    margin-bottom: 9px;
    font-size: 18px;
}

.topic-card p {
    color: #8996b2;
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 18px;
}

.open-btn {
    width: 100%;
    padding: 11px;
    background: #1b2742;
    color: white;
    border: 1px solid #334568;
    border-radius: 10px;
}

.open-btn:hover {
    background: #4169e1;
}

.hidden {
    display: none !important;
}

/* LESSON */

.lesson {
    max-width: 950px;
    margin: auto;
}

.back-btn {
    background: #151e34;
    border: 1px solid #2b3957;
    color: #cbd4e7;
    padding: 11px 17px;
    border-radius: 10px;
    margin-bottom: 20px;
}

.lesson-header {
    background: #121b30;
    border: 1px solid #293858;
    border-radius: 20px;
    padding: 30px;
    margin-bottom: 18px;
}

.lesson-header h1 {
    font-size: 32px;
    margin-bottom: 10px;
}

.lesson-header p {
    color: #9aa7c1;
}

.lesson-box {
    background: #111827;
    border: 1px solid #26324e;
    border-radius: 18px;
    padding: 25px;
    margin-bottom: 18px;
}

.lesson-box h2 {
    margin-bottom: 15px;
    color: #dce5f8;
}

.lesson-box p,
.lesson-box li {
    color: #b4bfd4;
    line-height: 1.7;
}

.lesson-box ul {
    padding-left: 22px;
}

.formulas {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px;
}

.formula {
    background: #0b1221;
    border: 1px solid #2b3b61;
    border-radius: 13px;
    padding: 20px;
    text-align: center;
    font-size: 22px;
    color: #70a0ff;
    font-weight: bold;
}

.example {
    background: #0c1527;
    border-left: 4px solid #527cff;
    padding: 18px;
    border-radius: 8px;
    color: #c2cce0;
    line-height: 1.7;
}

.test-btn {
    width: 100%;
    padding: 15px;
    background: #4169e1;
    border: none;
    color: white;
    border-radius: 12px;
    font-size: 16px;
    font-weight: bold;
}

.test-btn:hover {
    background: #527cff;
}

/* TEST */

.test {
    max-width: 800px;
    margin: auto;
}

.progress {
    height: 8px;
    background: #1a2439;
    border-radius: 10px;
    overflow: hidden;
    margin: 20px 0;
}

.progress-bar {
    height: 100%;
    background: #527cff;
    width: 0%;
    transition: .3s;
}

.question-box {
    background: #111827;
    border: 1px solid #293754;
    border-radius: 20px;
    padding: 30px;
}

.question-number {
    color: #7197ff;
    margin-bottom: 15px;
}

.question {
    font-size: 23px;
    line-height: 1.5;
    margin-bottom: 25px;
}

.answers {
    display: grid;
    gap: 12px;
}

.answer {
    background: #172137;
    color: #d9e1f0;
    border: 1px solid #30405f;
    border-radius: 12px;
    padding: 15px;
    text-align: left;
    font-size: 16px;
    transition: .2s;
}

.answer:hover {
    background: #223150;
    border-color: #5b8cff;
}

.answer.correct {
    background: #173b2b;
    border-color: #35c77a;
}

.answer.wrong {
    background: #402029;
    border-color: #ef5b68;
}

.next-btn {
    margin-top: 20px;
    width: 100%;
    padding: 14px;
    background: #4169e1;
    border: none;
    color: white;
    border-radius: 11px;
    font-size: 16px;
}

.result {
    text-align: center;
    background: #111827;
    border: 1px solid #293754;
    padding: 45px 25px;
    border-radius: 22px;
}

.result-score {
    font-size: 55px;
    color: #6591ff;
    font-weight: bold;
    margin: 15px 0;
}

.result p {
    color: #9ca8bf;
    margin-bottom: 25px;
}

.restart-btn {
    background: #4169e1;
    color: white;
    border: none;
    border-radius: 11px;
    padding: 14px 25px;
}

/* MOBILE */

@media(max-width: 600px) {
    .header {
        padding: 0 18px;
    }

    .header-right {
        display: none;
    }

    .container {
        padding: 20px 15px 50px;
    }

    .hero {
        padding: 28px 22px;
    }

    .hero h1 {
        font-size: 31px;
    }

    .section-title {
        font-size: 23px;
    }

    .lesson-header h1 {
        font-size: 26px;
    }

    .question {
        font-size: 19px;
    }
}
</style>
</head>

</main>

/* =========================
   ПЕРЕМЕННЫЕ
========================= */

let currentTopic = null;
let currentQuestion = 0;
let score = 0;


/* =========================
   ГЛАВНАЯ
========================= */

function renderTopics() {

    const box8 = document.getElementById("topics8");
    const box9 = document.getElementById("topics9");

    box8.innerHTML = "";
    box9.innerHTML = "";

    topics8.forEach((topic, index) => {
        box8.innerHTML += createTopicCard(topic, index + 1);
    });

    topics9.forEach((topic, index) => {
        box9.innerHTML += createTopicCard(topic, index + 1);
    });
}


function createTopicCard(topic, index) {

    return `
        <div class="topic-card">

            <div class="topic-number">
                ТЕМА ${index}
            </div>

            <h3>${topic.title}</h3>

            <p>${topic.description}</p>

            <button
                class="open-btn"
                onclick="openLesson('${topic.id}')">
                Изучить тему →
            </button>

        </div>
    `;
}


/* =========================
   ВЫБОР КЛАССА
========================= */

function showGrade(grade, button) {

    document.querySelectorAll(".grade-btn")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    document.getElementById("topics8")
        .classList.toggle("hidden", grade !== 8);

    document.getElementById("topics9")
        .classList.toggle("hidden", grade !== 9);
}


/* =========================
   ОТКРЫТИЕ ТЕМЫ
========================= */

function findTopic(id) {

    return [...topics8, ...topics9]
        .find(topic => topic.id === id);
}


function openLesson(id) {

    currentTopic = findTopic(id);

    document.getElementById("home")
        .classList.add("hidden");

    document.getElementById("test")
        .classList.add("hidden");

    document.getElementById("lesson")
        .classList.remove("hidden");

    renderLesson();

    window.scrollTo(0, 0);
}


function renderLesson() {

    const topic = currentTopic;

    document.getElementById("lessonContent").innerHTML = `

        <div class="lesson-header">

            <h1>${topic.title}</h1>

            <p>${topic.description}</p>

        </div>


        <div class="lesson-box">

            <h2>📖 Конспект</h2>

            <p>${topic.theory}</p>

        </div>


        <div class="lesson-box">

            <h2>🧮 Основные формулы</h2>

            <div class="formulas">

                ${topic.formulas
                    .map(formula => `
                        <div class="formula">
                            ${formula}
                        </div>
                    `)
                    .join("")}

            </div>

        </div>


        <div class="lesson-box">

            <h2>💡 Пример</h2>

            <div class="example">
                ${topic.example}
            </div>

        </div>


        <div class="lesson-box">

            <h2>📝 Проверка знаний</h2>

            <p style="margin-bottom:18px;">
                В тесте будет ${topic.tests.length} вопросов.
                Проверь, насколько хорошо ты понял тему.
            </p>

            <button
                class="test-btn"
                onclick="startTest()">
                Пройти тест
            </button>

        </div>
    `;
}


/* =========================
   ТЕСТ
========================= */

function startTest() {

    currentQuestion = 0;
    score = 0;

    document.getElementById("lesson")
        .classList.add("hidden");

    document.getElementById("home")
        .classList.add("hidden");

    document.getElementById("test")
        .classList.remove("hidden");

    renderQuestion();

    window.scrollTo(0, 0);
}


function renderQuestion() {

    const questions = currentTopic.tests;

    if (currentQuestion >= questions.length) {

        showResult();

        return;
    }

    const q = questions[currentQuestion];

    const progress =
        (currentQuestion / questions.length) * 100;

    document.getElementById("testContent").innerHTML = `

        <div class="question-box">

            <div class="question-number">
                Вопрос ${currentQuestion + 1}
                из ${questions.length}
            </div>

            <div class="progress">
                <div
                    class="progress-bar"
                    style="width:${progress}%">
                </div>
            </div>

            <div class="question">
                ${q.q}
            </div>

            <div class="answers">

                ${q.a.map((answer, index) => `

                    <button
                        class="answer"
                        onclick="checkAnswer(${index}, this)">

                        ${answer}

                    </button>

                `).join("")}

            </div>

            <div id="nextContainer"></div>

        </div>
    `;
}


function checkAnswer(index, button) {

    const q = currentTopic.tests[currentQuestion];

    const buttons =
        document.querySelectorAll(".answer");

    buttons.forEach(btn => {
        btn.disabled = true;
    });

    if (index === q.correct) {

        button.classList.add("correct");

        score++;

    } else {

        button.classList.add("wrong");

        buttons[q.correct]
            .classList.add("correct");
    }

    document.getElementById("nextContainer").innerHTML = `

        <button
            class="next-btn"
            onclick="nextQuestion()">

            ${currentQuestion === currentTopic.tests.length - 1
                ? "Посмотреть результат"
                : "Следующий вопрос →"}

        </button>
    `;
}


function nextQuestion() {

    currentQuestion++;

    renderQuestion();
}


/* =========================
   РЕЗУЛЬТАТ
========================= */

function showResult() {

    const total = currentTopic.tests.length;

    const percent =
        Math.round((score / total) * 100);

    let message = "";

    if (percent === 100) {
        message = "Идеальный результат! Ты отлично знаешь эту тему.";
    }
    else if (percent >= 80) {
        message = "Отличный результат! Осталось совсем немного до идеала.";
    }
    else if (percent >= 60) {
        message = "Неплохо! Но некоторые моменты стоит повторить.";
    }
    else {
        message = "Стоит ещё раз посмотреть конспект и попробовать тест снова.";
    }

    document.getElementById("testContent").innerHTML = `

        <div class="result">

            <h1>Тест завершён</h1>

            <div class="result-score">
                ${score}/${total}
            </div>

            <p>
                ${message}
            </p>

            <button
                class="restart-btn"
                onclick="startTest()">
                Пройти ещё раз
            </button>

            <button
                class="restart-btn"
                style="margin-left:8px;"
                onclick="openLesson('${currentTopic.id}')">
                Вернуться к теме
            </button>

        </div>
    `;
}


/* =========================
   НАЗАД
========================= */

function goHome() {

    document.getElementById("lesson")
        .classList.add("hidden");

    document.getElementById("test")
        .classList.add("hidden");

    document.getElementById("home")
        .classList.remove("hidden");

    window.scrollTo(0, 0);
}


/* =========================
   ЗАПУСК
========================= */

renderTopics();

</script>
